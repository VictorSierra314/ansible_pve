---
- name: POSTCHECKS | Wait for 10min to have all service running or timeout/failing
  ansible.builtin.pause:
    minutes: 10

- name: POSTCHECKS | Load service facts
  ansible.builtin.service_facts:

- name: POSTCHECKS | Register services as a list
  ansible.builtin.set_fact:
    services_list: "{{ ansible_facts.services | dict2items }}"

- name: POSTCHECKS | Enable email notification if any services are in failed state
  when: item.value.state == "failed"
  loop: "{{ services_list }}"
  loop_control:
    label: "{{ item.value.name }}"
  ansible.builtin.set_fact:
    send_service_failed_notification: true

- name: POSTCHECKS | Email notification when services are in failed state
  when:
    - send_service_failed_notification | default(false) | bool
    - not fips_email_workaround | default(false) | bool
  delegate_to: localhost
  run_once: true
  community.general.mail:
    from: "{{ notification_sender }}"
    to: "{{ notification_email }}"
    host: "{{ smtp_host }}"
    port: "{{ smtp_port }}"
    username: "{{ smtp_user | default(omit) }}"
    password: "{{ smtp_password | default(omit) }}"
    attach: "{{ ansible_log.files[0].path | default(omit) }}"
    subject: "PVE VM Upgrade - ERROR - {{ inventory_hostname }} has services in FAILED state"
    body: |
      ---------------------------
      {{ inventory_hostname }} - Post upgrade check FAILED
      ---------------------------
      Some services are in FAILED state following up {{ inventory_hostname }} upgrade.
      Date: {{ ansible_date_time.date }}
      Time: {{ ansible_date_time.time }} {{ ansible_date_time.tz }}
      Services:
      {% for item in services_list %}
      {% if item.value.state == 'failed' %}
      - Service Name: {{ item.key }}, Service State: {{ item.value.state }}
      {% endif %}
      {% endfor %}

- name: POSTCHECKS | Email notification when services are in failed state - fips workaround
  when: 
    - send_service_failed_notification | default(false) | bool
    - fips_email_workaround | default(false) | bool
  run_once: true
  no_log: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
          import smtplib
          import ssl
          from email.message import EmailMessage

          smtp_host = "{{ smtp_host }}"
          smtp_port = {{ smtp_port }}
          smtp_user = "{{ smtp_user | default(omit) }}"
          smtp_password = "{{ smtp_password | default(omit) }}"

          msg = EmailMessage()
          msg["From"] = "{{ notification_sender }}"
          msg["To"] = "{{ notification_email }}"
          msg["Subject"] = "PVE VM Upgrade - ERROR - {{ inventory_hostname }} has services in FAILED state"

          msg.set_content("""\
          ---------------------------
          {{ inventory_hostname }} - Post upgrade check FAILED
          ---------------------------
          Some services are in FAILED state following up {{ inventory_hostname }} upgrade.
          Date: {{ ansible_date_time.date }}
          Time: {{ ansible_date_time.time }} {{ ansible_date_time.tz }}
          Services:
          {% for item in services_list %}
          {% if item.value.state == 'failed' %}
          - Service Name: {{ item.key }}, Service State: {{ item.value.state }}
          {% endif %}
          {% endfor %}
          """)

          ctx = ssl.create_default_context()
    
          smtp = smtplib.SMTP(smtp_host, smtp_port)
          smtp.ehlo()
          smtp.starttls(context=ctx)
          smtp.ehlo()
    
          def auth_login(challenge=None):
              if challenge:
                  return smtp_password
              return smtp_user

          smtp.auth("LOGIN", auth_login)

          smtp.send_message(msg)
          smtp.quit()
