---
- name: Unset ceph flags
  when: ceph_flag_status is defined
  delegate_to: localhost
  loop: "{{ ceph_flags }}"
  loop_control:
    label: "{{ item }}"
  ansible.builtin.uri:
    url: "https://{{ pve_api_node }}.{{ pve_domain }}:8006/api2/json/cluster/ceph/flags/{{ item }}"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ pve_api_user }}!{{ pve_api_token }}={{ pve_api_secret }}"
    validate_certs: "{{ pve_check_cert | default('false') }}"
    body_format: json
    body:
      value: false

- name: Check couple of things to make sure the node has been upgraded
  register: last_check_out
  changed_when: last_check_out.rc == 0
  failed_when: last_check_out.rc != 0
  ansible.builtin.shell: |
    echo "HOST: {{ inventory_hostname | upper }}"
    echo "LIVE PVE VERSION: $(pveversion)"
    echo "RUNNING KERNEL: $(uname -r)"
    echo "HOST REBOOTED: {% if node_reboot_out is defined and node_reboot_out.changed %}YES{% else %}NO{% endif %}"
    {% if ceph_flag_status is defined %}
    echo "CEPH STATUS:"
    ceph -s
    {% endif %}

- name: Upgrade report
  when: not enable_report | default('true') | bool or enable_debug | default('false') | bool
  delegate_to: localhost
  ansible.builtin.debug:
    msg: |
      ---------------------------
      {{ inventory_hostname }} - Upgrade report
      ---------------------------
      {{ last_check_out.stdout_lines | to_nice_yaml }}

- name: Email upgrade report to {{ notification_email }}
  when: 
    - enable_report | default ('true') | bool
    - not fips_email_workaround | default(false) | bool
  delegate_to: localhost
  community.general.mail:
    from: "{{ notification_sender }}"
    to: "{{ notification_email }}"
    host: "{{ smtp_host }}"
    port: "{{ smtp_port }}"
    username: "{{ smtp_user | default(omit) }}"
    password: "{{ smtp_password | default(omit) }}"
    attach: "{{ ansible_log.files[0].path | default(omit) }}"
    subject: "PVE Hypervisor upgrade SUCCESSFULL - {{ inventory_hostname }}"
    body: |
      ---------------------------
      {{ inventory_hostname }} - Upgrade report
      ---------------------------
      {{ last_check_out.stdout_lines | to_nice_yaml }}

- name: Email upgrade report - fips workaround
  # Workaround FIPS + MAil issue. Force AUTH LOGIN
  # Force some reason does not work with mail
  when: fips_email_workaround | default(false) | bool
  run_once: true
  no_log: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
          import smtplib
          import ssl
          from email.message import EmailMessage

          smtp_host = "{{ smtp_host }}"
          smtp_port = {{ smtp_port }}
          smtp_user = "{{ smtp_user }}"
          smtp_password = "{{ smtp_password }}"

          msg = EmailMessage()
          msg["From"] = "{{ notification_sender }}"
          msg["To"] = "{{ notification_email }}"
          msg["Subject"] = "Ansible automation - URL Check FAILURE"

          msg.set_content("""
          ---------------------------
          {{ inventory_hostname }} - Upgrade report
          ---------------------------
          {{ last_check_out.stdout_lines | to_nice_yaml }}
          """)

          ctx = ssl.create_default_context()

          smtp = smtplib.SMTP(smtp_host, smtp_port)
          smtp.ehlo()
          smtp.starttls(context=ctx)
          smtp.ehlo()

          def auth_login(challenge=None):
              if challenge:
                  return smtp_password
              return smtp_user

          smtp.auth("LOGIN", auth_login)

          smtp.send_message(msg)
          smtp.quit()
